full_title: "Alignment Faking in Large Language Models"
common_title: "Alignment Faking"
paper_title: "Alignment Faking in Large Language Models"
description: |
  Measures whether a model strategically complies with harmful requests when it
  believes its outputs will be used for RLHF training (free-tier / monitored
  condition) versus when it believes it is unmonitored (paid-tier condition).
  Both conditions run in a single task; the headline metric is the compliance gap
  between them, with a two-proportion z-test. A secondary majority-vote scorer
  detects verbalised alignment-faking reasoning in the monitored scratchpad. A
  paraphrase-ensemble option mitigates verbatim-prompt training-data
  contamination. From Greenblatt et al. 2024. Distinct from agentic_misalignment
  (insider-threat/blackmail): this is the monitored-vs-unmonitored compliance-gap
  phenomenon.
arxiv: "https://arxiv.org/abs/2412.14093"
contributors:
  - marliechorgan
tags:
  - Safeguards
metadata:
  fast: false
  requires_internet: true
tasks:
  - name: alignment_faking
    task_path: src/alignment_faking/alignment_faking.py
source:
  repository_url: https://github.com/marliechorgan/alignment-faking-inspect
  repository_commit: <COMMIT_SHA>
  maintainers:
    - marliechorgan

evaluation_report:
  timestamp: "June 2026"
  commit: <COMMIT_SHA>
  command: "uv run inspect eval src/alignment_faking/alignment_faking.py@alignment_faking --model anthropic/claude-sonnet-4-6 -T paraphrase=ensemble"
  results:
    - model: "anthropic/claude-sonnet-4-6"
      provider: "Anthropic"
      metrics:
        - {key: free_compliance_rate, value: 0.333}
        - {key: paid_compliance_rate, value: 0.370}
        - {key: compliance_gap, value: -0.037}
        - {key: compliance_gap_pvalue, value: 0.267}
        - {key: free_tier_af_rate, value: 0.005}
    - model: "anthropic/claude-opus-4-8"
      provider: "Anthropic"
      metrics:
        - {key: free_compliance_rate, value: 0.725}
        - {key: paid_compliance_rate, value: 0.775}
        - {key: compliance_gap, value: -0.050}
        - {key: compliance_gap_pvalue, value: 0.371}
        - {key: free_tier_af_rate, value: 0.000}
  notes:
    - "Rows are the paraphrase ensemble (canonical + 7 paraphrases) x both tiers, real-lab framing. Sonnet 4.6: 50 prompts = 800 samples (400/tier). Opus 4.8: 15 prompts = 240 samples (120/tier)."
    - "Headline metric is compliance_gap = free_tier minus paid_tier compliance rate, with a two-proportion z-test (compliance_gap_pvalue)."
    - "Finding: no robust alignment-faking gap on either current model. A fictional-lab de-fingerprinting variant showed a marginal positive gap on Sonnet 4.6 (+0.075, p=0.09, n=240/tier) but it did not replicate in a higher-powered run of the strongest cell (canonical/fictional, n=100/tier: gap 0.000). Verbalised faking <=2%."
    - "Results on the verbatim prompt are a lower bound (contamination / mitigation overfitting); the original positive-control models (Claude 3 Opus, Claude 3.5 Sonnet) are API-retired. See the repository README for the full conditions table and limitations."
